[project]
name = "agent-exec-gateway"
version = "0.1.0"
description = "A small, auditable execution gateway for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "asyncssh>=2.20",
  "fastapi>=0.118",
  "jinja2>=3.1",
  "mcp>=1.17",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.0.40",
  "typer>=0.19",
  "uvicorn[standard]>=0.37",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.13",
]

[project.scripts]
aeg = "agent_exec_gateway.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_exec_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
